# 游戏榜单监控平台 nginx 站点配置
# 由 remote-deploy.sh 安装到 /etc/nginx/conf.d/gamerank.conf
# SERVER_NAME_PLACEHOLDER 会被安装脚本替换为实际域名或 IP

server {
    listen 80;
    server_name SERVER_NAME_PLACEHOLDER;

    # 前端静态资源（Vue3 生产构建）
    root /opt/gamerank/frontend/dist;
    index index.html;

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 静态资源长缓存（index.html 除外，由 try_files 逻辑覆盖不到时回源）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
